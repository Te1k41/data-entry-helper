<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>tt-services-dashboard</title>
<link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
<div id="deepField"></div>
<div id="starfield"></div>
<button id="bgOnlyToggle" onclick="toggleBgOnly()">🌌 Background only</button>
<pre id="banner" class="banner"></pre>
<!-- True top-level overlay, NOT nested inside #workArea: #workArea has
     backdrop-filter (for the frosted-glass look), and any filter/
     backdrop-filter/transform on an ancestor makes position:fixed
     descendants position relative to THAT ancestor instead of the
     real viewport — breaks both "stays put on screen" and the drag
     math (which assumes viewport-relative coordinates). -->
<div id="speedrunPanel">
    <div id="speedrunSetup">
        <span>⏱ Speedrun from</span>
        <input type="time" id="speedrunStart">
        <span>to</span>
        <input type="time" id="speedrunEnd">
        <button onclick="startSpeedrun()">Start</button>
        <span id="speedrunError" class="speedrunError"></span>
    </div>
    <div id="speedrunRunning" style="display:none">
        <div id="speedrunDragHandle" class="speedrunTop">
            <span id="speedrunWindow" class="speedrunWindow"></span>
            <span id="speedrunClock" class="speedrunClock"></span>
            <span id="speedrunPace" class="speedrunPace"></span>
            <button onclick="stopSpeedrun()">Stop</button>
        </div>
        <div id="speedrunTasks" class="speedrunTasks"></div>
        <div id="speedrunSplits" class="speedrunSplits"></div>
    </div>
</div>
<div id="workArea">
<div id="asOf">loading…</div>
<div id="batchDayIndicator"></div>
<div id="dayTabs"></div>
<main>
    <div id="stats"></div>
    <div id="charts"></div>
    <div id="controls">
        <span class="ctrlGroup">
            <button onclick="load()">Refresh</button>
            <button onclick="clearFilters()">Clear Filters</button>
            <button id="splitToggleBtn" onclick="toggleShowAll()">Show All</button>
        </span>
        <span class="ctrlDivider"></span>
        <span class="ctrlGroup">
            <button onclick="previousBatch()">← Prev Day</button>
            <button onclick="nextBatch()">Next Day →</button>
        </span>
        <span class="ctrlDivider"></span>
        <span class="ctrlGroup">
            <select id="recalcDaySelect" title="Which weekday to use as the anchor when recalculating">
                <option value="">Today (auto)</option>
                <option value="0">Monday</option>
                <option value="1">Tuesday</option>
                <option value="2">Wednesday</option>
                <option value="3">Thursday</option>
                <option value="4">Friday</option>
            </select>
            <button onclick="recalculateWeek()">🔄 Recalculate</button>
        </span>
        <span class="ctrlDivider"></span>
        <span class="ctrlGroup">
            <button onclick="location.href='/settings-page'">⚙ Settings</button>
            <button onclick="location.href='/dashboard/ports'">🧠 Port &amp; Vessel Mappings</button>
            <button onclick="location.href='/dashboard/merge'">🖼 Merge Images</button>
            <button onclick="location.href='/dashboard/fill-test'">🧮 Fill Calculation Test</button>
            <button onclick="location.href='/dashboard/highlight-review'">🟡 Highlight Review</button>
            <button onclick="location.href='/dashboard/route-map'">🗺 Route Map</button>
            <button id="wellnessToggle" onclick="toggleWellnessReminders()">💛 Wellness reminders: off</button>
            <button onclick="testWellnessNotification()">🔔 Test notification now</button>
        </span>
        <span id="count"></span>
    </div>
    <div id="wellnessHelp"></div>
    <div id="wellnessCountdown"></div>
    <div id="content"></div>
</main>
</div>
<div id="remainingTodayBadge"></div>

<div id="wellnessBanner">
    <span class="wellnessEmoji"></span><span class="wellnessText"></span>
    <div class="wellnessActions">
        <button onclick="snoozeWellnessBanner()">Maybe in 10 min</button>
        <button class="wellnessDismiss" onclick="dismissWellnessBanner()">Thanks 💛</button>
    </div>
</div>

<script src="/dashboard/dashboard.js"></script>
</body>
</html>
